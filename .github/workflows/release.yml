name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew test lint assembleRelease
      - run: cp app/build/outputs/apk/release/app-release-unsigned.apk split-screen-${{ github.ref_name }}-unsigned.apk
      - uses: softprops/action-gh-release@v2
        with: { files: 'split-screen-*-unsigned.apk', generate_release_notes: true }
